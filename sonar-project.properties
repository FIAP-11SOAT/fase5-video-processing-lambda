# SonarQube Configuration for Python Lambda Project

# Project identification
sonar.projectKey=FIAP-11SOAT_fase5-video-processing-lambda
sonar.organization=fiap-11soat
sonar.projectName=AWS Lambda Authentication System
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Python specific settings
sonar.language=py
sonar.python.version=3.11

# Coverage report location
sonar.python.coverage.reportPaths=coverage.xml

# Exclude patterns
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/venv/**,\
  **/env/**,\
  **/.venv/**,\
  **/lambda-packages/**,\
  **/deploy/**,\
  **/.terraform/**,\
  **/src/alert_lambda/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**

# Coverage exclusions (files not requiring tests)
sonar.coverage.exclusions=\
  **/__init__.py,\
  **/tests/**,\
  **/deploy/**,\
  **/src/alert_lambda/**

# Encoding
sonar.sourceEncoding=UTF-8

# Minimum coverage threshold (80%)
sonar.coverage.minimum=80
